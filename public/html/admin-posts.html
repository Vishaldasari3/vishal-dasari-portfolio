<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Post Visibility — Vishal Dasari</title>
<link rel="icon" type="image/png" href="/assets/brand/vd-favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/admin.css">
</head>
<body>
<header class="admin-header"><a class="admin-brand" href="/" aria-label="Vishal Dasari — home"><img class="brand-logo" src="/assets/brand/vishal-dasari-logo.webp" alt="Vishal Dasari" width="216" height="72" decoding="async"></a><span class="workspace-label">Journal workspace</span><a href="/blog" class="preview-link" target="_blank" rel="noopener noreferrer">View journal ↗</a></header>
<main>
<section id="gate" aria-labelledby="gate-title">
  <div class="brand" style="justify-content: center;">
    <div class="brand-badge">VD</div>
    <div class="brand-name">Vishal Dasari</div>
  </div>
  <p class="eyebrow">PRIVATE WORKSPACE</p><h1 id="gate-title">Your words.<br>Your control.</h1><p>Manage article visibility and review conversations from one place.</p><label for="secret">Admin secret</label>
  <input type="password" id="secret" placeholder="Enter your admin secret" autocomplete="current-password">
  <button id="unlock-btn" onclick="loadPosts()">Open workspace <span aria-hidden="true">↗</span></button>
<p class="gate-footnote">Article visibility & comment moderation</p>
</section>
<section class="wrap" id="list" style="display:none;">
<div class="workspace-top"><p class="eyebrow">JOURNAL / CONTENT MANAGEMENT</p><button type="button" id="lock-btn">Lock workspace ↗</button></div>
<p id="admin-status" role="status" aria-live="polite"></p>
  <div id="posts-section"></div>
  <div id="comments-section"></div>
</section>
</main>
<script src="/js/site-environments.js"></script>
<script src="/js/portfolio-data.js"></script>
<script>
  const site = window.VD_SITE.resolve(location.hostname, location.port);
  document.querySelector('.admin-brand').href = site.portfolioOrigin ? site.portfolioOrigin + '/' : '/';
  document.querySelector('.preview-link').href = site.blogOrigin ? site.blogOrigin + '/' : '/blog';
  document.getElementById('secret').addEventListener('keydown', function (e) { if(e.key === 'Enter') loadPosts(); });
  document.getElementById('lock-btn').addEventListener('click', function () {

    document.getElementById('secret').value = '';
    document.getElementById('list').style.display = 'none';
    document.getElementById('gate').style.display = 'block';
    document.getElementById('secret').focus();
    document.getElementById('posts-section').replaceChildren();
    document.getElementById('comments-section').replaceChildren();
    document.getElementById('unlock-btn').disabled = false;
    document.getElementById('unlock-btn').textContent = 'Open workspace ↗';
  });
  function loadPosts() {
    var secret = document.getElementById('secret').value.trim();
    if (!secret) return;
    var btn = document.getElementById('unlock-btn');
    var err = document.getElementById('gate-err');
    btn.disabled = true; btn.textContent = 'Checking\u2026';
    if (err) err.style.display = 'none';
    fetch('/api/comments/admin?secret=' + encodeURIComponent(secret))
      .then(function (r) { if (!r.ok) throw new Error('unauthorized'); return r.json(); })
      .then(function () { unlockWith(secret); })
      .catch(function () {
        btn.disabled = false; btn.textContent = 'Open workspace ↗';
        if (err) { err.style.display = 'block'; } else {
          var p = document.createElement('p');
          p.id = 'gate-err'; p.style.color = '#d64545'; p.style.marginTop = '-4px'; p.style.marginBottom = '12px';
          p.textContent = 'Wrong secret.';
          document.getElementById('secret').insertAdjacentElement('afterend', p);
        }
      });
  }

  function unlockWith(secret) {

    document.getElementById('gate').style.display = 'none';
    document.getElementById('list').style.display = 'block';
    fetch('/api/posts-visibility')
      .then(function (r) { return r.json(); })
      .then(function (data) {
        var hidden = data.hidden || [];
        var section = document.getElementById('posts-section');
        var posts = window.VD_DATA.posts || [];
        var activeCount = posts.filter(function (p) { return hidden.indexOf(p.slug) === -1; }).length;
        var hiddenCount = posts.length - activeCount;
        section.innerHTML =
          '<div class="brand"><div class="brand-badge">VD</div><div class="brand-name">Vishal Dasari</div></div>' +
          '<h1>Post Visibility</h1>' +
          '<p class="sub">Toggle off to hide a post from the blog listing immediately.</p>' +
          '<div style="display:flex;gap:10px;margin-bottom:22px;">' +
            '<div style="font-size:12px;font-weight:600;color:#1fa363;background:rgba(31,163,99,0.1);border:1px solid rgba(31,163,99,0.2);padding:5px 12px;border-radius:14px;">' + activeCount + ' active</div>' +
            '<div style="font-size:12px;font-weight:600;color:#d64545;background:rgba(214,69,69,0.1);border:1px solid rgba(214,69,69,0.2);padding:5px 12px;border-radius:14px;">' + hiddenCount + ' hidden</div>' +
          '</div>';
        posts.forEach(function (p) {
          var isHidden = hidden.indexOf(p.slug) !== -1;
          var card = document.createElement('div');
          card.className = 'card';
          var titleEl = document.createElement('div');
          var t = document.createElement('div'); t.className = 'p-title'; t.textContent = p.title;
          var m = document.createElement('div'); m.className = 'p-meta';
          var mCount = document.createElement('span'); mCount.textContent = '\u2026';
          m.appendChild(document.createTextNode((p.category === 'tech' ? 'Tech' : 'Personal life') + ' \u00b7 ' + p.date + ' \u00b7 '));
          m.appendChild(mCount);
          titleEl.appendChild(t); titleEl.appendChild(m);
          fetch('/api/comments/' + encodeURIComponent(p.slug))
            .then(function (r) { return r.json(); })
            .then(function (rows) { mCount.textContent = (rows.length || 0) + (rows.length === 1 ? ' comment' : ' comments'); })
            .catch(function () { mCount.textContent = '\u2013'; });
          var sw = document.createElement('button');
          sw.className = 'switch' + (isHidden ? '' : ' on');
          sw.innerHTML = '<span class="knob"></span>';
          sw.setAttribute('role','switch');
          sw.setAttribute('aria-checked', String(!isHidden));
          sw.setAttribute('aria-label', 'Publish ' + p.title);
          sw.title = isHidden ? 'Hidden' : 'Published';
          sw.addEventListener('click', function () {
            var nowHidden = sw.classList.contains('on');
            sw.disabled = true;
            document.getElementById('admin-status').textContent = 'Saving visibility…';
            fetch('/api/posts-visibility', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ slug: p.slug, hidden: nowHidden, secret: secret }),
            }).then(function (response) {
              if (!response.ok) throw new Error('save failed');
              document.getElementById('admin-status').textContent = 'Visibility updated.';
              unlockWith(secret);
            }).catch(function () {
              sw.disabled = false;
              document.getElementById('admin-status').textContent = 'Could not save. Please try again.';
            });
          });
          card.appendChild(titleEl);
          card.appendChild(sw);
          section.appendChild(card);
        });
      })
      .catch(function () {
        document.getElementById('posts-section').innerHTML =
          '<div class="brand"><div class="brand-badge">VD</div><div class="brand-name">Vishal Dasari</div></div>' +
          '<h1>Post Visibility</h1>' +
          '<p class="sub" style="color:#d64545;">Couldn\u2019t load posts \u2014 check the API is deployed and try again.</p>';
      });
    loadComments(secret);
  }

  function loadComments(secret) {
    var box = document.getElementById('comments-section');
    fetch('/api/comments/admin?secret=' + encodeURIComponent(secret))
      .then(function (r) { return r.json(); })
      .then(function (rows) {
        if (rows.error) { box.innerHTML = '<div class="section-title">Pending Comments</div><div class="sub" style="color:#d64545;">Wrong secret.</div>'; return; }
        box.innerHTML = '<div class="section-title">Pending Comments (' + rows.length + ')</div>';
        if (!rows.length) {
          box.innerHTML += '<div class="sub">Nothing to review right now.</div>';
          return;
        }
        rows.forEach(function (c) {
          var cbox = document.createElement('div');
          cbox.className = 'cbox';
          cbox.innerHTML = '<div class="meta"><span class="slug-pill"></span><span></span></div><div class="text"></div>';
          cbox.querySelector('.slug-pill').textContent = c.slug;
          cbox.querySelector('.meta span:last-child').textContent = c.name;
          cbox.querySelector('.text').textContent = c.text;
          var approveBtn = document.createElement('button');
          approveBtn.className = 'approve'; approveBtn.textContent = 'Approve';
          var rejectBtn = document.createElement('button');
          rejectBtn.className = 'reject'; rejectBtn.textContent = 'Reject';
          approveBtn.addEventListener('click', function () { actComment(c.id, 'approve', secret, cbox); });
          rejectBtn.addEventListener('click', function () { actComment(c.id, 'reject', secret, cbox); });
          cbox.appendChild(approveBtn);
          cbox.appendChild(rejectBtn);
          box.appendChild(cbox);
        });
      })
      .catch(function () {
        box.innerHTML = '<div class="section-title">Pending Comments</div><div class="sub" style="color:#d64545;">Couldn\u2019t load comments.</div>';
      });
  }

  function actComment(id, action, secret, cbox) {
    cbox.querySelectorAll('button').forEach(function(b) { b.disabled = true; });
    fetch('/api/comments/admin', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id: id, action: action, secret: secret }),
    }).then(function (response) {
      if (!response.ok) throw new Error('moderation failed');
      document.getElementById('admin-status').textContent = 'Comment updated.';
      loadComments(secret);
    }).catch(function () {
      cbox.querySelectorAll('button').forEach(function(b) { b.disabled = false; });
      document.getElementById('admin-status').textContent = 'Could not update comment. Please try again.';
    });
  }
</script>
</body>
</html>
